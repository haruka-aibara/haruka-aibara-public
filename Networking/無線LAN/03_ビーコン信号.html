<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ビーコン信号</title>
<style>
:root{
  --bg:#fbfaf8; --card:#fff; --ink:#23201d; --muted:#6b645c; --line:#e3ded6;
  --lane:#eeeae4; --warn-bg:#fdf3f1; --warn-line:#e0b4ac;
  --c1:#3d6b9c; --c2:#b8562f; --c3:#5f8248; --c4:#7a63a0; --stop:#c2453a; --on:#fff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17161a; --card:#1e1d22; --ink:#e8e4dd; --muted:#9d968c; --line:#34323a;
    --lane:#2a2830; --warn-bg:#2a1e1d; --warn-line:#6b3b35;
    --c1:#5c8cc0; --c2:#cf6c42; --c3:#77a05c; --c4:#9680bd; --stop:#d75b4f; --on:#15141a;
  }
}
*{box-sizing:border-box}
body{
  margin:0;padding:2.5rem 1.25rem 5rem;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  line-height:1.85;font-size:16px;
}
main{max-width:52rem;margin:0 auto}
h1{font-size:1.9rem;line-height:1.35;margin:0 0 .4rem}
.lede{color:var(--muted);margin:0 0 2.5rem;font-size:1.02rem}
h2{font-size:1.25rem;margin:3rem 0 .6rem;padding-top:1.4rem;border-top:1px solid var(--line)}
h3{font-size:1.02rem;margin:1.8rem 0 .4rem}
p{margin:.7rem 0}
figure{margin:1.4rem 0;padding:1.1rem 1.1rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:10px}
figure svg{display:block;width:100%;height:auto}
figcaption{margin-top:.7rem;font-size:.86rem;color:var(--muted);line-height:1.7}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:.9rem 1.1rem;margin:1.4rem 0}
.note strong{color:var(--stop)}
table{border-collapse:collapse;width:100%;margin:1.2rem 0;font-size:.93rem}
th,td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
th{background:var(--lane);font-weight:600}
code{background:var(--lane);padding:.1em .4em;border-radius:4px;font-size:.9em}
ul{padding-left:1.3rem}li{margin:.35rem 0}
a{color:var(--c1)}
</style>
</head>
<body>
<main>

<h1>ビーコン信号</h1>
<p class="lede">端末の「Wi-Fi 一覧」は、どうやって埋まっているのか。</p>
<h2>AP が定期的に自分から名乗っている</h2>
<p>アクセスポイントは、何も聞かれていなくても<strong>一定間隔で「ここに私がいます」という短いフレームを送り続けている</strong>。これがビーコン信号で、既定ではおよそ 100 ミリ秒ごと。端末はこれを受け取って、電波の届く AP の一覧を作る。</p>

<figure>
<svg viewBox="0 0 700 190" role="img" aria-label="ビーコン信号で端末の一覧が埋まる様子">
  <defs>
    <marker id="bc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--c1)"/></marker>
  </defs>
  <rect x="0" y="52" width="150" height="60" rx="8" fill="var(--lane)" stroke="var(--line)"/>
  <text x="75" y="78" font-size="11" fill="var(--ink)" text-anchor="middle">アクセスポイント</text>
  <text x="75" y="96" font-size="10.5" fill="var(--muted)" text-anchor="middle">約 100ms ごと</text>

  <line x1="158" y1="82" x2="266" y2="82" stroke="var(--c1)" stroke-width="1.4" marker-end="url(#bc)"/>
  <line x1="158" y1="60" x2="266" y2="60" stroke="var(--c1)" stroke-width="1.4" marker-end="url(#bc)" opacity=".55"/>
  <line x1="158" y1="104" x2="266" y2="104" stroke="var(--c1)" stroke-width="1.4" marker-end="url(#bc)" opacity=".55"/>

  <rect x="276" y="34" width="196" height="96" rx="8" fill="var(--card)" stroke="var(--c1)"/>
  <text x="374" y="54" font-size="11" font-weight="600" fill="var(--c1)" text-anchor="middle">ビーコンに載っている情報</text>
  <text x="374" y="76" font-size="10.5" fill="var(--ink)" text-anchor="middle">ESSID（ネットワークの名前）</text>
  <text x="374" y="94" font-size="10.5" fill="var(--ink)" text-anchor="middle">対応している通信速度</text>
  <text x="374" y="112" font-size="10.5" fill="var(--ink)" text-anchor="middle">暗号方式・チャネル・時刻</text>

  <rect x="510" y="34" width="190" height="96" rx="8" fill="var(--lane)" stroke="var(--line)"/>
  <text x="605" y="54" font-size="11" fill="var(--ink)" text-anchor="middle">端末の Wi-Fi 一覧</text>
  <text x="605" y="76" font-size="10.5" fill="var(--muted)" text-anchor="middle">office-wifi　鍵あり</text>
  <text x="605" y="94" font-size="10.5" fill="var(--muted)" text-anchor="middle">guest　鍵なし</text>
  <text x="605" y="112" font-size="10.5" fill="var(--muted)" text-anchor="middle">…</text>

  <text x="350" y="162" font-size="10.5" fill="var(--muted)" text-anchor="middle">端末側から「◯◯はいますか」と呼びかけて探す方法（プローブ要求）もある</text>
</svg>
<figcaption>ビーコンは暗号化されない。名前も暗号方式も、接続していない誰にでも読める。</figcaption>
</figure>

<h2>参考</h2>
<ul>
<li><a href="https://standards.ieee.org/ieee/802.11/7028/">IEEE 802.11 — Wireless LAN MAC and PHY Specifications</a></li>
</ul>

</main>
</body>
</html>
