<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANY モード</title>
<style>
:root{
  --bg:#fbfaf8; --card:#fff; --ink:#23201d; --muted:#6b645c; --line:#e3ded6;
  --lane:#eeeae4; --warn-bg:#fdf3f1; --warn-line:#e0b4ac;
  --c1:#3d6b9c; --c2:#b8562f; --c3:#5f8248; --c4:#7a63a0; --stop:#c2453a; --on:#fff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17161a; --card:#1e1d22; --ink:#e8e4dd; --muted:#9d968c; --line:#34323a;
    --lane:#2a2830; --warn-bg:#2a1e1d; --warn-line:#6b3b35;
    --c1:#5c8cc0; --c2:#cf6c42; --c3:#77a05c; --c4:#9680bd; --stop:#d75b4f; --on:#15141a;
  }
}
*{box-sizing:border-box}
body{
  margin:0;padding:2.5rem 1.25rem 5rem;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  line-height:1.85;font-size:16px;
}
main{max-width:52rem;margin:0 auto}
h1{font-size:1.9rem;line-height:1.35;margin:0 0 .4rem}
.lede{color:var(--muted);margin:0 0 2.5rem;font-size:1.02rem}
h2{font-size:1.25rem;margin:3rem 0 .6rem;padding-top:1.4rem;border-top:1px solid var(--line)}
h3{font-size:1.02rem;margin:1.8rem 0 .4rem}
p{margin:.7rem 0}
figure{margin:1.4rem 0;padding:1.1rem 1.1rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:10px}
figure svg{display:block;width:100%;height:auto}
figcaption{margin-top:.7rem;font-size:.86rem;color:var(--muted);line-height:1.7}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:.9rem 1.1rem;margin:1.4rem 0}
.note strong{color:var(--stop)}
table{border-collapse:collapse;width:100%;margin:1.2rem 0;font-size:.93rem}
th,td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
th{background:var(--lane);font-weight:600}
code{background:var(--lane);padding:.1em .4em;border-radius:4px;font-size:.9em}
ul{padding-left:1.3rem}li{margin:.35rem 0}
a{color:var(--c1)}
</style>
</head>
<body>
<main>

<h1>ANY モード</h1>
<p class="lede">「名前は指定しないので、いる AP は全部返事して」という探し方。</p>
<h2>端末が白紙で呼びかける</h2>
<p>端末が AP を探すとき、ESSID の欄を空（または <code>ANY</code>）にしたプローブ要求を出す方法がある。受け取った AP は自分の名前を返すので、端末は近くの AP を一通り集められる。Wi-Fi 一覧が埋まるのはこの仕組みでもある。</p>
<p>AP 側にはこれを<strong>拒否する設定</strong>（ANY 接続拒否）があり、有効にすると「名前を指定していない呼びかけ」には応答しなくなる。ステルスモードと組み合わせて使われる。</p>

<figure>
<svg viewBox="0 0 700 200" role="img" aria-label="ANYモードの許可と拒否の違い">
  <defs>
    <marker id="an1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--c1)"/></marker>
    <marker id="an2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
  <text x="0" y="14" font-size="11.5" font-weight="600" fill="var(--c1)">ANY を許可（既定）</text>
  <rect x="0" y="24" width="150" height="48" rx="7" fill="var(--lane)" stroke="var(--line)"/>
  <text x="75" y="53" font-size="11" fill="var(--ink)" text-anchor="middle">端末</text>
  <line x1="156" y1="38" x2="404" y2="38" stroke="var(--c1)" stroke-width="1.5" marker-end="url(#an1)"/>
  <text x="280" y="31" font-size="10.5" fill="var(--c1)" text-anchor="middle">「誰かいますか？」（名前を指定しない）</text>
  <line x1="404" y1="60" x2="156" y2="60" stroke="var(--c1)" stroke-width="1.5" marker-end="url(#an1)"/>
  <text x="280" y="76" font-size="10.5" fill="var(--c1)" text-anchor="middle">「office-wifi です」と各 AP が応答</text>
  <rect x="410" y="24" width="290" height="48" rx="7" fill="var(--lane)" stroke="var(--line)"/>
  <text x="555" y="53" font-size="11" fill="var(--ink)" text-anchor="middle">近くの AP すべて</text>

  <line x1="0" y1="104" x2="700" y2="104" stroke="var(--line)"/>

  <text x="0" y="130" font-size="11.5" font-weight="600" fill="var(--c3)">ANY を拒否</text>
  <rect x="0" y="140" width="150" height="48" rx="7" fill="var(--lane)" stroke="var(--line)"/>
  <text x="75" y="169" font-size="11" fill="var(--ink)" text-anchor="middle">端末</text>
  <line x1="156" y1="154" x2="404" y2="154" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#an2)"/>
  <text x="280" y="147" font-size="10.5" fill="var(--muted)" text-anchor="middle">「誰かいますか？」</text>
  <text x="280" y="176" font-size="10.5" fill="var(--c3)" text-anchor="middle">応答しない（一覧に出てこない）</text>
  <rect x="410" y="140" width="290" height="48" rx="7" fill="var(--card)" stroke="var(--c3)"/>
  <text x="555" y="163" font-size="11" fill="var(--c3)" text-anchor="middle">名前を名指しされたときだけ返事する</text>
  <text x="555" y="180" font-size="10.5" fill="var(--muted)" text-anchor="middle">＝つなぐ側は名前を知っている必要がある</text>
</svg>
<figcaption>ステルスモードと同じで、名前を知っている端末の呼びかけからは名前が漏れる。「知らない人がうっかりつなぐ」を減らす設定であって、防御策ではない。</figcaption>
</figure>

<h2>参考</h2>
<ul>
<li><a href="https://www.ipa.go.jp/security/vuln/websecurity/wireless-lan.html">IPA — 無線 LAN のセキュリティ</a></li>
</ul>

</main>
</body>
</html>
